[project]
name = "miniagent"
version = "0.1.0"
description = "Hand-written agent loop + mini coding agent (no framework)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
serve = ["fastapi>=0.110", "uvicorn>=0.30"]   # optional HTTP service (miniagent-serve); the agent itself needs nothing

[project.scripts]
miniagent = "miniagent.cli:main"
miniagent-eval = "miniagent.eval.cli:main"
miniagent-serve = "miniagent.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["miniagent", "miniagent.eval", "miniagent.mcp", "miniagent.taskgen"]

[tool.setuptools.package-data]
"miniagent.eval" = ["viewer/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
